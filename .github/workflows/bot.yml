name: 하찮은 모험담 봇

on:
  schedule:
    - cron: "*/15 * * * *"   # 15분마다 새 소식 확인
    - cron: "0 11 * * 0"     # 매주 일요일 20:00 KST 주간 정리
  workflow_dispatch:          # Actions 탭에서 수동 실행
    inputs:
      mode:
        description: "update / weekly / weekly-test(주간 정리를 내 1:1 대화로) / intro(소개글 1회) / backfill(최근 7일치 1회)"
        default: "update"
      days:
        description: "backfill 때 며칠치를 올릴지"
        default: "7"
      repost:
        description: "backfill 때 이미 올린 것도 다시 올릴지 (yes/no)"
        default: "no"

permissions:
  contents: write             # state.json 저장용

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main               # 실행이 예약된 시점이 아니라 '지금'의 최신 state.json을 받음
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: "@janghyeyeong_quest"
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          TELEGRAM_OWNER: ${{ secrets.TELEGRAM_OWNER }}
        run: |
          if [ "${{ inputs.mode }}" = "intro" ]; then
            python bot.py intro
          elif [ "${{ inputs.mode }}" = "weekly-test" ]; then
            python bot.py weekly --test
          elif [ "${{ inputs.mode }}" = "backfill" ]; then
            if [ "${{ inputs.repost }}" = "yes" ]; then
              python bot.py backfill --since "${{ inputs.days }}" --repost
            else
              python bot.py backfill --since "${{ inputs.days }}"
            fi
          elif [ "${{ github.event.schedule }}" = "0 11 * * 0" ] || [ "${{ inputs.mode }}" = "weekly" ]; then
            python bot.py weekly
          else
            python bot.py
          fi
      - name: 상태 저장
        run: |
          git config user.name "jhy-quest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "상태 갱신"
          # 다른 실행이 먼저 저장했으면, 양쪽 기록을 합친 뒤 그 위에 다시 저장 (최대 3번)
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git show origin/main:state.json > /tmp/remote_state.json
            python bot.py merge-state /tmp/remote_state.json
            git reset origin/main     # 색인을 원격 기준으로 (그 사이 바뀐 manual.yml 등을 되돌리지 않도록)
            git add state.json
            git commit -m "상태 갱신 (병합)"
          done
          exit 1
